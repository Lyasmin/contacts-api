<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contacts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F5EFDD;
    --ink: #2B2620;
    --ink-soft: #6B6355;
    --card: #FFFDF7;
    --line: #DED4B8;
    --line-strong: #C9BC98;
    --work: #1F6B5C;
    --work-bg: #DCEEE9;
    --personal: #7A3F5C;
    --personal-bg: #F3E3EC;
    --danger: #A3432F;
    --danger-bg: #F7E4DE;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper: #1E1B16;
      --ink: #EDE7D9;
      --ink-soft: #A69D89;
      --card: #29241D;
      --line: #4A4130;
      --line-strong: #5C5138;
      --work: #7FD4BE;
      --work-bg: #234A41;
      --personal: #E6A8C7;
      --personal-bg: #4A2C3D;
      --danger: #E8917D;
      --danger-bg: #4A2A20;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1E1B16;
    --ink: #EDE7D9;
    --ink-soft: #A69D89;
    --card: #29241D;
    --line: #4A4130;
    --line-strong: #5C5138;
    --work: #7FD4BE;
    --work-bg: #234A41;
    --personal: #E6A8C7;
    --personal-bg: #4A2C3D;
    --danger: #E8917D;
    --danger-bg: #4A2A20;
  }
  * { box-sizing: border-box; }
  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    margin: 0;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body { min-height: 100vh; }
  h1, h2, .serif { font-family: 'Fraunces', serif; }
  #root { min-height: 100vh; }
  input, select {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid var(--line-strong);
    background: var(--card);
    color: var(--ink);
    width: 100%;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--work);
  }
  button { font-family: 'Inter', sans-serif; cursor: pointer; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

function initials(name) {
  const parts = name.trim().split(" ").filter(Boolean);
  if (parts.length === 0) return "?";
  if (parts.length === 1) return parts[0][0].toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function CategoryPill({ category }) {
  const isWork = category === "work";
  return (
    <span style={{
      fontSize: 12,
      fontWeight: 600,
      padding: "3px 10px",
      borderRadius: 999,
      background: isWork ? "var(--work-bg)" : "var(--personal-bg)",
      color: isWork ? "var(--work)" : "var(--personal)",
    }}>
      {isWork ? "Work" : "Personal"}
    </span>
  );
}

function LoginScreen({ onLogin }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    if (!email || !password) {
      setError("Enter your email and password.");
      return;
    }
    setError("");
    setLoading(true);
    try {
      const res = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        setError(data.error || "Could not log in. Check your credentials.");
        setLoading(false);
        return;
      }
      onLogin(data.token);
    } catch (err) {
      setError("Could not connect to the server. Try again.");
    }
    setLoading(false);
  }

  return (
    <div style={{
      minHeight: "100vh",
      display: "flex",
      alignItems: "center",
      justifyContent: "center",
      padding: 24,
    }}>
      <form onSubmit={handleSubmit} style={{
        width: "100%",
        maxWidth: 360,
        background: "var(--card)",
        border: "1px solid var(--line)",
        borderRadius: 14,
        padding: "40px 32px",
      }}>
        <h1 style={{
          fontSize: 30,
          fontWeight: 500,
          fontStyle: "italic",
          margin: "0 0 4px",
        }}>Contacts</h1>
        <p style={{ color: "var(--ink-soft)", fontSize: 14, margin: "0 0 28px" }}>
          Your address book, organized in one place.
        </p>

        <label style={{ display: "block", fontSize: 13, fontWeight: 500, marginBottom: 6 }}>Email</label>
        <input
          type="email"
          placeholder="you@example.com"
          value={email}
          onChange={(e) => setEmail(e.target.value)}
          style={{ marginBottom: 16 }}
        />

        <label style={{ display: "block", fontSize: 13, fontWeight: 500, marginBottom: 6 }}>Password</label>
        <input
          type="password"
          placeholder="Your password"
          value={password}
          onChange={(e) => setPassword(e.target.value)}
          style={{ marginBottom: error ? 8 : 24 }}
        />

        {error && (
          <p style={{ color: "var(--danger)", fontSize: 13, margin: "0 0 16px" }}>{error}</p>
        )}

        <button type="submit" disabled={loading} style={{
          width: "100%",
          padding: "12px",
          background: "var(--work)",
          color: "var(--paper)",
          border: "none",
          borderRadius: 8,
          fontSize: 15,
          fontWeight: 600,
          opacity: loading ? 0.7 : 1,
        }}>
          {loading ? "Logging in..." : "Log in"}
        </button>
      </form>
    </div>
  );
}

function ContactForm({ initial, onSave, onCancel }) {
  const [name, setName] = useState(initial ? initial.name : "");
  const [email, setEmail] = useState(initial ? initial.email : "");
  const [phone, setPhone] = useState(initial ? initial.phone : "");
  const [category, setCategory] = useState(initial ? initial.category : "personal");
  const [error, setError] = useState("");

  function handleSubmit(e) {
    e.preventDefault();
    if (!name.trim() || !email.trim() || !phone.trim()) {
      setError("Name, email and phone are required.");
      return;
    }
    if (!/^\S+@\S+\.\S+$/.test(email)) {
      setError("Enter a valid email.");
      return;
    }
    setError("");
    onSave({ name: name.trim(), email: email.trim(), phone: phone.trim(), category });
  }

  return (
    <form onSubmit={handleSubmit} style={{
      background: "var(--card)",
      border: "1px dashed var(--line-strong)",
      borderRadius: 12,
      padding: 20,
      marginBottom: 20,
    }}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>
        <div>
          <label style={{ display: "block", fontSize: 12, fontWeight: 500, marginBottom: 4 }}>Name</label>
          <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Full name" />
        </div>
        <div>
          <label style={{ display: "block", fontSize: 12, fontWeight: 500, marginBottom: 4 }}>Category</label>
          <select value={category} onChange={(e) => setCategory(e.target.value)}>
            <option value="personal">Personal</option>
            <option value="work">Work</option>
          </select>
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>
        <div>
          <label style={{ display: "block", fontSize: 12, fontWeight: 500, marginBottom: 4 }}>Email</label>
          <input value={email} onChange={(e) => setEmail(e.target.value)} placeholder="name@example.com" />
        </div>
        <div>
          <label style={{ display: "block", fontSize: 12, fontWeight: 500, marginBottom: 4 }}>Phone</label>
          <input value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="10000000000" />
        </div>
      </div>

      {error && <p style={{ color: "var(--danger)", fontSize: 13, margin: "0 0 12px" }}>{error}</p>}

      <div style={{ display: "flex", gap: 8 }}>
        <button type="submit" style={{
          padding: "9px 18px",
          background: "var(--work)",
          color: "var(--paper)",
          border: "none",
          borderRadius: 8,
          fontSize: 14,
          fontWeight: 600,
        }}>
          {initial ? "Save changes" : "Add contact"}
        </button>
        <button type="button" onClick={onCancel} style={{
          padding: "9px 18px",
          background: "transparent",
          color: "var(--ink-soft)",
          border: "1px solid var(--line-strong)",
          borderRadius: 8,
          fontSize: 14,
          fontWeight: 500,
        }}>
          Cancel
        </button>
      </div>
    </form>
  );
}

function ContactCard({ contact, onEdit, onDelete }) {
  const [confirmingDelete, setConfirmingDelete] = useState(false);
  const isWork = contact.category === "work";

  return (
    <div style={{
      background: "var(--card)",
      border: "1px solid var(--line)",
      borderRadius: 12,
      overflow: "hidden",
      position: "relative",
    }}>
      <div style={{ height: 4, background: isWork ? "var(--work)" : "var(--personal)" }} />
      <div style={{ padding: "16px 18px" }}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 8 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, minWidth: 0 }}>
            <div style={{
              width: 38, height: 38, borderRadius: "50%",
              background: isWork ? "var(--work-bg)" : "var(--personal-bg)",
              color: isWork ? "var(--work)" : "var(--personal)",
              display: "flex", alignItems: "center", justifyContent: "center",
              fontWeight: 600, fontSize: 14, flexShrink: 0,
            }}>
              {initials(contact.name)}
            </div>
            <div style={{ minWidth: 0 }}>
              <p className="serif" style={{ margin: 0, fontSize: 17, fontWeight: 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                {contact.name}
              </p>
              <div style={{ marginTop: 3 }}>
                <CategoryPill category={contact.category} />
              </div>
            </div>
          </div>
          <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
            <button onClick={onEdit} aria-label="Edit" style={{
              width: 30, height: 30, border: "1px solid var(--line)", background: "transparent",
              borderRadius: 6, color: "var(--ink-soft)", fontSize: 13,
            }}>✎</button>
            <button onClick={() => setConfirmingDelete(true)} aria-label="Delete" style={{
              width: 30, height: 30, border: "1px solid var(--line)", background: "transparent",
              borderRadius: 6, color: "var(--ink-soft)", fontSize: 13,
            }}>✕</button>
          </div>
        </div>

        <div style={{ marginTop: 14, fontSize: 13.5, color: "var(--ink-soft)", lineHeight: 1.9 }}>
          <div>{contact.email}</div>
          <div>{contact.phone}</div>
        </div>
      </div>

      {confirmingDelete && (
        <div style={{
          padding: "12px 18px",
          background: "var(--danger-bg)",
          borderTop: "1px solid var(--line)",
          display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8,
        }}>
          <span style={{ fontSize: 13, color: "var(--danger)" }}>Delete this contact?</span>
          <div style={{ display: "flex", gap: 6 }}>
            <button onClick={() => { onDelete(); setConfirmingDelete(false); }} style={{
              padding: "5px 12px", background: "var(--danger)", color: "var(--paper)",
              border: "none", borderRadius: 6, fontSize: 12.5, fontWeight: 600,
            }}>Delete</button>
            <button onClick={() => setConfirmingDelete(false)} style={{
              padding: "5px 12px", background: "transparent", color: "var(--ink-soft)",
              border: "1px solid var(--line-strong)", borderRadius: 6, fontSize: 12.5,
            }}>Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
}

function ContactsScreen({ token, onLogout }) {
  const [contacts, setContacts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [errorMsg, setErrorMsg] = useState("");
  const [showAddForm, setShowAddForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [query, setQuery] = useState("");

  async function loadContacts() {
    setLoading(true);
    setErrorMsg("");
    try {
      const res = await fetch("/contacts", {
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await res.json();
      if (!res.ok) {
        setErrorMsg(data.error || "Could not load contacts.");
        setLoading(false);
        return;
      }
      setContacts(data);
    } catch (err) {
      setErrorMsg("Could not connect to the server.");
    }
    setLoading(false);
  }

  useEffect(() => {
    loadContacts();
  }, []);

  async function addContact(data) {
    const res = await fetch("/contacts", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`,
      },
      body: JSON.stringify(data),
    });
    const created = await res.json();
    if (!res.ok) {
      setErrorMsg(created.error || "Could not create the contact.");
      return;
    }
    setContacts((prev) => [...prev, created]);
    setShowAddForm(false);
  }

  async function saveEdit(id, data) {
    const res = await fetch(`/contacts/${id}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`,
      },
      body: JSON.stringify(data),
    });
    const updated = await res.json();
    if (!res.ok) {
      setErrorMsg(updated.error || "Could not save the changes.");
      return;
    }
    setContacts((prev) => prev.map((c) => (c._id === id ? updated : c)));
    setEditingId(null);
  }

  async function deleteContact(id) {
    const res = await fetch(`/contacts/${id}`, {
      method: "DELETE",
      headers: { Authorization: `Bearer ${token}` },
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      setErrorMsg(data.error || "Could not delete the contact.");
      return;
    }
    setContacts((prev) => prev.filter((c) => c._id !== id));
  }

  const filtered = contacts.filter((c) =>
    c.name.toLowerCase().includes(query.toLowerCase()) ||
    c.email.toLowerCase().includes(query.toLowerCase())
  );

  return (
    <div style={{ maxWidth: 880, margin: "0 auto", padding: "32px 20px 60px" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 28, flexWrap: "wrap", gap: 12 }}>
        <h1 className="serif" style={{ fontSize: 28, fontWeight: 500, fontStyle: "italic", margin: 0 }}>Contacts</h1>
        <button onClick={onLogout} style={{
          padding: "8px 16px", background: "transparent", color: "var(--ink-soft)",
          border: "1px solid var(--line-strong)", borderRadius: 8, fontSize: 13.5,
        }}>Log out</button>
      </div>

      <div style={{ display: "flex", gap: 10, marginBottom: 20, flexWrap: "wrap" }}>
        <input
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          placeholder="Search by name or email"
          style={{ flex: 1, minWidth: 200 }}
        />
        <button onClick={() => setShowAddForm((v) => !v)} style={{
          padding: "10px 18px", background: showAddForm ? "transparent" : "var(--work)",
          color: showAddForm ? "var(--ink-soft)" : "var(--paper)",
          border: showAddForm ? "1px solid var(--line-strong)" : "none",
          borderRadius: 8, fontSize: 14, fontWeight: 600, whiteSpace: "nowrap",
        }}>
          {showAddForm ? "Cancel" : "+ New contact"}
        </button>
      </div>

      {errorMsg && (
        <div style={{
          background: "var(--danger-bg)", color: "var(--danger)", padding: "10px 14px",
          borderRadius: 8, fontSize: 13.5, marginBottom: 16,
        }}>
          {errorMsg}
        </div>
      )}

      {showAddForm && (
        <ContactForm onSave={addContact} onCancel={() => setShowAddForm(false)} />
      )}

      {loading ? (
        <p style={{ color: "var(--ink-soft)", fontSize: 14 }}>Loading contacts...</p>
      ) : filtered.length === 0 ? (
        <div style={{
          textAlign: "center", padding: "60px 20px", color: "var(--ink-soft)",
          border: "1px dashed var(--line-strong)", borderRadius: 12,
        }}>
          <p className="serif" style={{ fontSize: 18, margin: "0 0 6px" }}>No contacts found</p>
          <p style={{ fontSize: 14, margin: 0 }}>Try another search or add a new contact.</p>
        </div>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))", gap: 14 }}>
          {filtered.map((c) =>
            editingId === c._id ? (
              <div style={{ gridColumn: "1 / -1" }} key={c._id}>
                <ContactForm
                  initial={c}
                  onSave={(data) => saveEdit(c._id, data)}
                  onCancel={() => setEditingId(null)}
                />
              </div>
            ) : (
              <ContactCard
                key={c._id}
                contact={c}
                onEdit={() => setEditingId(c._id)}
                onDelete={() => deleteContact(c._id)}
              />
            )
          )}
        </div>
      )}
    </div>
  );
}

function App() {
  const [token, setToken] = useState(null);
  return token
    ? <ContactsScreen token={token} onLogout={() => setToken(null)} />
    : <LoginScreen onLogin={(t) => setToken(t)} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
